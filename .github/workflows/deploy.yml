name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build on server and deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trust server host key
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Copy source to server
        run: |
          set -euo pipefail
          tar -czf - --exclude=./.git . \
            | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
                "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"

      - name: Build image and recreate container on server
        env:
          APP_PORT: ${{ vars.APP_PORT || 8080 }}
          APP_VERSION: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' APP_PORT='$APP_PORT' APP_VERSION='$APP_VERSION' bash -s" <<'REMOTE'
            set -eu
            cd "$DEPLOY_PATH"

            # Fail early if the copy is incomplete (e.g. etc/ was never
            # uploaded) instead of dying inside the build with a checksum error.
            for f in Dockerfile docker-compose.yml index.php etc/nginx.conf etc/supervisord.conf; do
              if [ ! -f "$f" ]; then
                echo "missing build input: $DEPLOY_PATH/$f" >&2
                exit 1
              fi
            done

            # Build locally from the copied source; no registry involved.
            docker compose up -d --build --remove-orphans

            # Let Caddy (on the host or in another container) reach the
            # published port across the Docker bridge. Idempotent: ufw reports
            # the rule already exists and exits 0.
            if command -v ufw >/dev/null 2>&1; then
              sudo -n ufw allow from 172.16.0.0/12 to any port "$APP_PORT" proto tcp \
                comment 'Allow Caddy to reach rootless preview app' ||
                { echo "ufw rule failed: the deploy user needs passwordless sudo for ufw" >&2; exit 1; }
            else
              echo "ufw not found; skipping firewall rule" >&2
            fi

            # Drop the image the rebuild replaced; keep the build cache for the next deploy.
            docker image prune -af

            docker compose ps
          REMOTE
