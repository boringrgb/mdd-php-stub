name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build on server and deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trust server host key
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Copy source to server
        run: |
          tar -czf - --exclude=./.git . \
            | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
                "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"

      - name: Build image and recreate container on server
        env:
          APP_PORT: ${{ vars.APP_PORT || 8080 }}
          APP_VERSION: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' APP_PORT='$APP_PORT' APP_VERSION='$APP_VERSION' bash -s" <<'REMOTE'
            set -eu
            cd "$DEPLOY_PATH"

            # Build locally from the copied source; no registry involved.
            docker compose up -d --build --remove-orphans

            # Drop the image the rebuild replaced; keep the build cache for the next deploy.
            docker image prune -af

            docker compose ps
          REMOTE
